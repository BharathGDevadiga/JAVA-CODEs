name: Java Compile Check

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Compile all Java files (excluding Pla/proj1)
      run: |
        find . -name "*.java" ! -path "*/Pla/proj1/*" -print0 | xargs -0 javac -d out/
