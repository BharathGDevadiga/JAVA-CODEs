name: Java Compile Check

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Compile all Java files
      run: |
        # Find all .java files and compile them
        # If there is a syntax error in any file, this step will fail
        find . -name "*.java" -print0 | xargs -0 javac -d out/
